name: Bug report
description: Something in Wynnlabs does not work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to make it happen
      placeholder: |
        1. Open the Wynnlabs menu (Y)
        2. Go to the Mounts tab
        3. ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Item tooltips and advice
        - Wynnlabs menu (layout, Home, Today)
        - Mounts and Mount Feeder
        - Quests, discoveries and the guide line
        - Ability tree and builds (Damage, Community)
        - Endgame (raids, lootruns, aspects, pools)
        - Crafting
        - Gathering (node boxes, professions)
        - Bank, prices and Search
        - Maps (world events, guild map, content book)
        - Coach, deaths and HUD
        - Local API and AI assistant
        - Settings
        - Other
    validations:
      required: true
  - type: input
    id: wynnlabs
    attributes:
      label: Wynnlabs version
      description: The jar's name in your mods folder, or Mod Menu.
      placeholder: "0.2.38"
    validations:
      required: true
  - type: dropdown
    id: loader
    attributes:
      label: Loader
      options:
        - Fabric
        - NeoForge
    validations:
      required: true
  - type: input
    id: wynntils
    attributes:
      label: Wynntils version
      placeholder: "4.2.19"
    validations:
      required: true
  - type: input
    id: wynncraft
    attributes:
      label: Wynncraft version
      description: Shown on the bottom left of the pause menu.
      placeholder: "2.2.8"
  - type: input
    id: others
    attributes:
      label: Other mods (optional)
      description: Other Wynncraft mods you use, with versions, if the bug may involve them.
  - type: textarea
    id: log
    attributes:
      label: Log or screenshot
      description: >-
        The lines from logs/latest.log around the error, or a screenshot. Remove your player name,
        character ids and any API key before posting.
      render: text
