name: Feature request
description: An idea for Wynnlabs
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would it help with
      description: The decision or chore in the game this would make easier.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What the mod should show or do. A sketch is welcome for UI ideas.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Item tooltips and advice
        - Wynnlabs menu (layout, Home, Today)
        - Mounts and Mount Feeder
        - Quests, discoveries and the guide line
        - Ability tree and builds (Damage, Community)
        - Endgame (raids, lootruns, aspects, pools)
        - Crafting
        - Gathering (node boxes, professions)
        - Bank, prices and Search
        - Maps (world events, guild map, content book)
        - Coach, deaths and HUD
        - Local API and AI assistant
        - Something new
  - type: checkboxes
    id: readonly
    attributes:
      label: Read-only
      options:
        - label: The idea only reads and shows; it does not click, move, cast or send anything for the player.
          required: true
